<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LivingGlass Dashboard</title>
  <!-- 外部設定ファイルの読み込み -->
  <script src="./config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
    }

    /* ダッシュボードグリッドコンテナ */
    #dashboard-container {
      display: grid;
      width: 100%;
      height: 100%;
      background-color: #000000;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* スムーズなピクセルシフト */
    }

    /* iframe のシームレス表示 */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000000;
    }

    /* 画面焼き付き防止・リフレッシュ用フェードオーバーレイ */
    #refresh-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      opacity: 0;
      pointer-events: none; /* 通常時はクリックやスクロールを一切阻害しない */
      transition: opacity 1s ease-in-out;
      z-index: 99999;
    }

    #refresh-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* 設定なしの場合のメッセージ表示 */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    #empty-state h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #4facfe;
    }

    #empty-state p {
      color: #a0aec0;
      max-width: 500px;
      line-height: 1.6;
    }

    #empty-state code {
      background: #1a202c;
      padding: 4px 8px;
      border-radius: 4px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- 画面レイアウト用コンテナ -->
  <div id="dashboard-container"></div>

  <!-- 暗転リフレッシュ用オーバーレイ -->
  <div id="refresh-overlay"></div>

  <!-- 設定未完了時のメッセージ画面 -->
  <div id="empty-state" style="display: none;">
    <h1>LivingGlass</h1>
    <p>設定ファイル <code>config.js</code> に表示対象のURLが指定されていません。<br><code>urls</code> 配列に表示したいWebページのURLを追加してください。</p>
  </div>

  <script>
    (function () {
      const config = window.LIVING_GLASS_CONFIG || { urls: [] };
      const container = document.getElementById('dashboard-container');
      const overlay = document.getElementById('refresh-overlay');
      const emptyState = document.getElementById('empty-state');

      // 最大3つのURLを取得
      const rawUrls = Array.isArray(config.urls) ? config.urls : [];
      const targetUrls = rawUrls.filter(url => typeof url === 'string' && url.trim() !== '').slice(0, 3);

      if (targetUrls.length === 0) {
        container.style.display = 'none';
        emptyState.style.display = 'flex';
        return;
      }

      // ① 登録URL数に応じた動的Gridカラム生成 (1枠: 100%, 2枠: 50%/50%, 3枠: 33.3%x3)
      container.style.gridTemplateColumns = `repeat(${targetUrls.length}, 1fr)`;

      // iframe の生成
      const iframes = targetUrls.map((url, index) => {
        const iframe = document.createElement('iframe');
        iframe.id = `livingglass-frame-${index}`;
        iframe.src = url;
        iframe.allow = "fullscreen; autoplay";
        container.appendChild(iframe);
        return iframe;
      });

      // ② ピクセルシフト機能 (一定間隔ごとに -2px ~ +2px ランダム微少移動)
      const shiftInterval = config.shiftIntervalMs || (5 * 60 * 1000);
      setInterval(() => {
        const dx = Math.floor(Math.random() * 5) - 2; // -2, -1, 0, 1, 2
        const dy = Math.floor(Math.random() * 5) - 2;
        container.style.transform = `translate(${dx}px, ${dy}px)`;
      }, shiftInterval);

      // ③ 定期暗転 ＆ 全iframeサイレントリロード
      const refreshInterval = config.refreshIntervalMs || (15 * 60 * 1000);
      setInterval(() => {
        // 暗転フェードアウト
        overlay.classList.add('active');

        // 暗転中に全iframeの再読み込み
        setTimeout(() => {
          iframes.forEach((iframe, idx) => {
            try {
              iframe.src = targetUrls[idx];
            } catch (e) {
              console.error("Frame refresh failed:", e);
            }
          });
        }, 1000);

        // 明転フェードインで復帰
        setTimeout(() => {
          overlay.classList.remove('active');
        }, 2200);
      }, refreshInterval);
    })();
  </script>
</body>
</html>
